name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TAMPERPROBE_LAB_PYTHON: python3

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: gradle/actions/setup-gradle@v4

      # Validates every sidecar, the developer documentation and the one-to-one runtime
      # bindings, and regenerates the catalog.
      - name: Generate and validate the detector catalog
        run: python3 tamperprobe/scripts/generate_detections_manifest.py

      - name: Fail if generated artifacts were committed stale
        run: |
          if ! git diff --quiet; then
            echo "::error::Generated artifacts are out of date. Run tamperprobe/scripts/generate_detections_manifest.py and commit the result."
            git --no-pager diff --stat
            exit 1
          fi

      - name: Native build (all ABIs)
        run: ./gradlew :tamperprobe:externalNativeBuildDebug --no-daemon

      - name: JVM unit tests
        run: ./gradlew :tamperprobe:testDebugUnitTest :app:testDebugUnitTest :tamperprobe-rasp:testDebugUnitTest :retrofit:common:testDebugUnitTest :retrofit:rootbeer:testDebugUnitTest :retrofit:ruru:testDebugUnitTest --no-daemon

      - name: Assemble the probe app and the research RASP bundle
        run: ./gradlew assembleDebug :tamperprobe-rasp:prepareRaspBundle --no-daemon

      - name: Python test suites
        run: |
          python3 -m unittest discover -s tamperprobe/scripts/tests -v
          python3 -m unittest discover -s injector/tests -v
          python3 -m unittest discover -s scripts/tests -v
          python3 -m unittest discover -s retrofit/tools/tests -v

      - name: Verify the vendored upstream code is unmodified
        run: python3 retrofit/tools/verify_upstream.py

      - name: Verify the staged RASP bundle
        run: python3 injector/verify_bundle.py tamperprobe-rasp/build/rasp-bundle/staging

      - name: Whitespace check
        run: git diff --check
